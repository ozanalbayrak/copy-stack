name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution — it helps find the simplest fix.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work?
